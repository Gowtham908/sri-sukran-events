<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Sukran Events | ஸ்ரீ சுக்ரன் ஈவென்ட்ஸ்</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Language Switcher -->
    <div class="lang-box p-2 text-end container">
        <button class="btn btn-sm btn-outline-dark me-2" onclick="switchLang('en')">English</button>
        <button class="btn btn-sm btn-danger" onclick="switchLang('ta')">தமிழ்</button>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SRI SUKRAN <span class="text-gold">EVENTS</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home" id="nav-home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#gallery" id="nav-gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services" id="nav-services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact" id="nav-contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Video Section -->
    <header id="home" class="hero-wrap">
        <div class="overlay"></div>
        <!-- Replace 'your-video.mp4' with your actual event video file name later -->
        <video playsinline="playsinline" autoplay="autoplay" muted="muted" loop="loop">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-wedding-reception-hall-decoration-4148-large.mp4" type="video/mp4">
        </video>
        <div class="container h-100">
            <div class="d-flex h-100 text-center align-items-center">
                <div class="w-100 text-white">
                    <h1 class="display-3 fw-bold" id="hero-title">Sri Sukran Events</h1>
                    <p class="lead mb-5" id="hero-desc">We bring magic to your celebrations!</p>
                    <a href="https://wa.me/917708298661" class="btn btn-gold btn-lg"><i class="fab fa-whatsapp me-2"></i> <span id="btn-book">Book Now</span></a>
                </div>
            </div>
        </div>
    </header>

    <!-- Services Section -->
    <section id="services" class="py-5 bg-light">
        <div class="container text-center">
            <h2 class="mb-4" id="services-title">Our Services</h2>
            <div class="row g-4">
                <div class="col-6 col-md-3">
                    <div class="service-box">
                        <i class="fas fa-gem"></i>
                        <p id="s1">Wedding Reception</p>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="service-box">
                        <i class="fas fa-birthday-cake"></i>
                        <p id="s2">Birthday Party</p>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="service-box">
                        <i class="fas fa-gift"></i>
                        <p id="s3">Surprise Events</p>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="service-box">
                        <i class="fas fa-car"></i>
                        <p id="s4">Car Decoration</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Photo Gallery -->
    <section id="gallery" class="py-5">
        <div class="container">
            <h2 class="text-center mb-5" id="gallery-title">Event Highlights</h2>
            <div class="row g-3">
                <!-- Replace 'img1.jpg' with your real photos in the D:\ drive -->
                <div class="col-md-4"><img src="https://placehold.co/600x400/8B0000/white?text=Wedding+Stage" class="img-fluid rounded gallery-img shadow-sm" alt="Stage"></div>
                <div class="col-md-4"><img src="https://placehold.co/600x400/DAA520/black?text=Birthday+Balloons" class="img-fluid rounded gallery-img shadow-sm" alt="Birthday"></div>
                <div class="col-md-4"><img src="https://placehold.co/600x400/8B0000/white?text=Plate+Decoration" class="img-fluid rounded gallery-img shadow-sm" alt="Plates"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="contact" class="bg-dark text-white text-center py-4">
        <p class="mb-1">Proprietor: <strong>V. Yadhavan</strong></p>
        <p><i class="fas fa-phone"></i> 77082 98661</p>
        <a href="https://instagram.com/Sri_Sukran_Eventz" class="text-gold fs-3"><i class="fab fa-instagram"></i></a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
